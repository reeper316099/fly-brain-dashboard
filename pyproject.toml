[project]
name = "fly-brain-dashboard"
version = "0.1.0"
description = "Live local dashboard simulating spiking activity over a real MaleCNS v1.0 fruit fly connectome subgraph."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "aiohttp>=3.9",
    "requests>=2.31",
]

# This repo is an application (scripts + a server + a static dashboard),
# not an installable library, so uv only needs to manage the dependencies.
# Without this, `uv sync` tries to build the project itself with setuptools,
# which fails with "Multiple top-level packages discovered in a flat-layout".
[tool.uv]
package = false
