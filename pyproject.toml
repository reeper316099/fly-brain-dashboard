[project]
name = "fly-brain-dashboard"
version = "0.1.0"
description = "Live local dashboard simulating spiking activity over a real MaleCNS v1.0 fruit fly connectome subgraph."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "aiohttp>=3.9",
    "requests>=2.31",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
